<section>
  <header class="panel__header">
    <div>
      <h1>Platform health</h1>
      <p>Bank Hub database readiness</p>
    </div>
    <button type="button" (click)="refresh()" [disabled]="loading()">Refresh</button>
  </header>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (health(); as h) {
    <div class="overall" [class.unhealthy]="h.status === 'Unhealthy'">
      Database: {{ h.status }}
      <span class="muted">Checked {{ h.checkedAtUtc | date: 'medium' }}</span>
    </div>
  }
</section>
